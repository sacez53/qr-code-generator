<!DOCTYPE html>
<html lang="fr" data-theme="qr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d2bc4" />
  <title>Générateur de QR code</title>
  <meta name="description" content="Créez un QR code à votre forme : couleurs, logo SVG et aperçu en direct. Gratuit et sans compte." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231d2bc4' d='M2 2h9v9H2zm11 0h9v9h-9zM2 13h9v9H2zm11 0h4v4h-4zm5 5h4v4h-4z'/%3E%3C/svg%3E" />
  <link rel="preload" href="vendor/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="QR code" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("qr-theme"); } catch (error) { /* stockage indisponible */ }
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "qr-dark" : "qr");
    })();
  </script>
  <link rel="stylesheet" href="vendor/daisyui.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <main class="home">
    <div class="home-qr">
      <canvas id="home-qr" role="img" aria-label="Exemple de QR code dont les points changent de forme au toucher"></canvas>
      <button class="btn btn-xs motion-hint" type="button" id="motion-hint" hidden>Activer le mouvement</button>
    </div>
    <div class="home-text">
      <h1>Des QR codes<br />à votre forme.</h1>
      <p>Choisissez les formes et les couleurs, ajoutez votre logo. Gratuit, sans compte, et tout reste sur votre appareil.</p>
      <a class="btn btn-lg enter" href="generateur.html">Entrer</a>
    </div>
  </main>
  <script src="vendor/qr-code-styling.js"></script>
  <script src="home.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
